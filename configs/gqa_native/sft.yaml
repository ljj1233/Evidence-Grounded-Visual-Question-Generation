# GQA-native Stage 1 SFT — image-conditioned VQG (Qwen3-VL-8B-Instruct), LoRA, bf16.
# Identical recipe to configs/new_vqg/sft.yaml; only the dataset and output change.
stage: sft
task: image_to_question
base_model: models/Qwen3-VL-8B-Instruct
train_data: outputs/gqa_native/full_ours/data/sft_train_50000.jsonl
output_dir: outputs/gqa_native/full_ours/sft
seed: 42
max_seq_length: 512
instruction: "Generate a question about this image."

image:
  min_pixels: 4096
  max_pixels: 147456

precision:
  bf16: true

lora:
  enabled: true
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  effective_batch_size: 16
  num_train_epochs: 2
  learning_rate: 2.0e-4
  warmup_ratio: 0.03
  logging_steps: 10
  save_steps: 500
  save_total_limit: 3
  dataloader_num_workers: 8
  gradient_checkpointing: true
  attn_implementation: flash_attention_2
