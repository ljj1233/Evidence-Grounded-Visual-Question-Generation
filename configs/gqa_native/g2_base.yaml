# GQA-native Full Ours (base-init, no GQA-SFT) — G2 static-UVFC GRPO from D1.
# Shared 10k manifest with B2/B3/SeeQ; all learned parameters are GQA-native.
stage: online_uvfc_grpo
run_name: gqa_full_ours_base_g2
variant: static
seed: 42

base_model: models/Qwen3-VL-8B-Instruct
sft_checkpoint: outputs/gqa_native/full_ours_base/distill_d1/checkpoint-final
guard_sft_checkpoint: outputs/gqa_native/full_ours_base/base_zero_lora
guard_calibration_manifest: outputs/gqa_native/full_ours_base/data/method_train_10000.jsonl
guard_calibration_n: 32
uvfc_dir: outputs/gqa_native/full_ours_base/uvfc
flat_model: models/Qwen2.5-VL-7B-Instruct
instruction: "Generate a question about this image."

train_manifest: outputs/gqa_native/full_ours_base/data/method_train_10000.jsonl
output_dir: outputs/gqa_native/full_ours_base/g2

group_size: 4
groups_per_step: 8
max_steps: 1000
inner_epochs: 1

temperature: 0.8
top_p: 0.9
max_new_tokens: 32
generation_batch_size: 8
flat_batch_size: 32

lr: 1.0e-6
betas: [0.9, 0.999]
weight_decay: 0.0
clip_epsilon: 0.2
beta_kl: 0.02
log_ratio_clamp: 20.0

checkpoint_steps: [0, 50, 100, 150, 250, 500, 750]
rollout_snapshot_every: 50
refresh_every: 0
attn_implementation: sdpa

dev_manifest: outputs/gqa_native/manifests/dev1000_images.jsonl
greedy_out: outputs/gqa_native/full_ours_base/g2/greedy1000.jsonl
sampled_out: outputs/gqa_native/full_ours_base/g2/sampled4x1000.jsonl
