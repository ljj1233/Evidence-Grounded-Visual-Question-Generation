# Stage 2 GRPO — intentionally blocked until a calibrated reward protocol is frozen.
stage: grpo
status: blocked
reason: Phase 2.3 freezes evaluation and does not authorize GRPO or a reward weight.
base_model: models/Qwen3-8B
rollout_data: src/vvqg/data/rollout
output_dir: checkpoint/grpo
seed: 42

lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]

grpo:
  num_generations: 4
  max_new_tokens: 48
  temperature: 1.0
  learning_rate: 1.0e-6
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  bf16: true
