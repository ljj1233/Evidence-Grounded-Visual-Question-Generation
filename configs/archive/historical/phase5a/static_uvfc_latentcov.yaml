# Phase 5A — Static UVFC + frozen latent coverage reward (single-variable).
# Identical to configs/phase4b/static_uvfc.yaml except the reward gains a frozen
# latent coverage bonus and the run/output paths.  checkpoint_steps adds 250 so
# the required 0/25/50/75/100% evaluation points are all materialized.
stage: online_uvfc_latentcov_grpo
run_name: static_uvfc_latentcov
variant: static
seed: 42

base_model: /hpc2hdd/home/fye374/models/Qwen3-VL-8B-Instruct
sft_checkpoint: outputs/checkpoints/qwen3vl8b_lora_r16_vqav2_50k/checkpoint-final
uvfc_dir: outputs/phase26/vfc
coverage_dir: outputs/phase5a_latent_coverage/coverage_bank
flat_model: /hpc2hdd/home/fye374/models/Qwen2.5-VL-7B-Instruct
instruction: "Generate a question about this image."

train_manifest: outputs/phase4b_online_uvfc/data/train_10000.jsonl
output_dir: outputs/phase5a_static_uvfc_latentcov

group_size: 4
groups_per_step: 8
max_steps: 1000
inner_epochs: 1

temperature: 0.8
top_p: 0.9
max_new_tokens: 32
generation_batch_size: 8
flat_batch_size: 32
latentcov_lambda: 0.15
latentcov_batch_size: 8

lr: 1.0e-6
betas: [0.9, 0.999]
weight_decay: 0.0
clip_epsilon: 0.2
beta_kl: 0.02
log_ratio_clamp: 20.0

checkpoint_steps: [0, 100, 200, 250, 500, 750]
rollout_snapshot_every: 50
refresh_every: 0
attn_implementation: sdpa

dev_manifest: outputs/same_backbone_baselines/manifests/development1000_images.jsonl
greedy_out: outputs/phase5a_static_uvfc_latentcov/greedy1000.jsonl
sampled_out: outputs/phase5a_static_uvfc_latentcov/sampled4x1000.jsonl
