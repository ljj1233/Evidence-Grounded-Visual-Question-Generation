[project]
name = "vvqg-data"
version = "0.1.0"
description = "Reproducible source adapters for the VVQG pilot"
requires-python = ">=3.10"
dependencies = ["Pillow>=10", "PyYAML>=6", "remotezip>=0.12"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: verifies frozen experiment or dataset artifacts",
  "external_artifact(*paths): requires the named repository-relative external files",
]
